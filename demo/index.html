<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案排版台 · Demo</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --panel-2:#1c212a; --line:#252c38;
    --text:#e8ecf3; --muted:#8b97a8; --accent:#4f8cff; --accent-2:#7bd88f;
    --warn:#f2b544; --danger:#f2635f; --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  .app{display:grid;grid-template-columns:216px 1fr;height:100vh;overflow:hidden}

  /* ---------- 侧栏 ---------- */
  .side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:22px}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4f8cff,#7b5cff);display:grid;place-items:center;font-weight:700;font-size:14px}
  .brand-name{font-weight:600;letter-spacing:.2px}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:-4px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:transparent;border-radius:9px;color:var(--muted);text-align:left;width:100%}
  .nav-item:hover{background:var(--panel-2);color:var(--text)}
  .nav-item.on{background:#1e2a44;color:#cfe0ff}
  .nav-item .ico{width:18px;text-align:center;opacity:.9}
  .side-foot{margin-top:auto;font-size:11px;color:#5d6778;padding:0 8px;line-height:1.7}
  .side-foot b{color:#7d8798;font-weight:600}

  /* ---------- 主区 ---------- */
  .main{overflow:auto;padding:22px 26px 40px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12.5px}
  .btn{border:1px solid var(--line);background:var(--panel-2);padding:8px 13px;border-radius:9px;color:var(--text)}
  .btn:hover{border-color:#39445a}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  .btn.primary:hover{background:#3f7bf0}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 9px;font-size:12px;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .grid{display:grid;gap:12px}
  .muted{color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;background:#1e2531;color:#9fb0c7;border:1px solid #2a3342}
  .tag.ok{background:#16281d;color:#8fe0a4;border-color:#24402e}
  .tag.warn{background:#2a2213;color:#f2c46a;border-color:#453718}
  .tag.bad{background:#2b1a19;color:#f28e8a;border-color:#4a2624}
  .tag.info{background:#172438;color:#8fb6ff;border-color:#23395c}

  /* ---------- 工作台 ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .stat-num{font-size:22px;font-weight:650;letter-spacing:.3px}
  .stat-label{font-size:12px;color:var(--muted)}
  .deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .deck-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:.15s;cursor:pointer}
  .deck-card:hover{transform:translateY(-2px);border-color:#39445a}
  .deck-cover{aspect-ratio:16/9;position:relative;overflow:hidden}
  .deck-body{padding:12px 14px}
  .deck-title{font-weight:600;margin-bottom:4px}

  /* ---------- 幻灯片渲染 ---------- */
  .stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;background:#0b0d11}
  .slide{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left;background:#fff;color:#1a1f2a;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
  .slide .pad{padding:64px 72px;height:100%;display:flex;flex-direction:column}
  .thumb-wrap{width:180px;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#0b0d11;position:relative}
  .thumb-wrap .slide{transform:scale(.140625)}
  .thumb-wrap.sm{width:140px}
  .thumb-wrap.sm .slide{transform:scale(.109375)}
  .slide .brandline{font-size:20px;letter-spacing:3px;color:#8b95a7}
  .cover-h{font-size:66px;line-height:1.15;font-weight:800;letter-spacing:-1px}
  .cover-p{font-size:24px;color:#5d6a80;margin-top:18px}
  .cover-tag{display:inline-block;align-self:flex-start;font-size:16px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(4px)}
  .hl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;flex:1}
  .hl-card{border-radius:18px;padding:28px 24px;background:#f4f6fa;display:flex;flex-direction:column;gap:14px}
  .hl-num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:19px;color:#fff}
  .hl-title{font-size:26px;font-weight:700}
  .hl-text{font-size:17px;line-height:1.7;color:#5b6678;flex:1}
  .hl-img{height:112px;border-radius:12px;position:relative;overflow:hidden}
  .slide-h2{font-size:42px;font-weight:800;margin:0 0 8px;letter-spacing:-.5px}
  .slide-sub{font-size:18px;color:#7b8698;margin-bottom:30px}
  .tbl{width:100%;border-collapse:collapse;font-size:18px}
  .tbl th{text-align:left;padding:14px 16px;background:#f1f4f9;color:#48546a;font-weight:600;font-size:15px;letter-spacing:.5px}
  .tbl td{padding:15px 16px;border-bottom:1px solid #e7ebf2;vertical-align:top}
  .tbl .day{font-weight:700;color:#2b6cff;white-space:nowrap}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1;align-content:center}
  .stat-box{border-radius:16px;padding:26px 20px;background:#f4f6fa;text-align:center}
  .stat-v{font-size:52px;font-weight:800;letter-spacing:-1px}
  .stat-k{font-size:16px;color:#6b7688;margin-top:4px}
  .slide .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:15px;color:#9aa4b4;border-top:1px solid #e7ebf2;padding-top:16px}
  .img-ph{position:relative;overflow:hidden;display:grid;place-items:center}
  .img-ph .lbl{position:absolute;left:10px;bottom:8px;font-size:14px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.32);padding:3px 9px;border-radius:999px}
  .img-ph .warn-dot{position:absolute;right:10px;top:10px;font-size:13px;background:#f2b544;color:#3a2a00;padding:3px 9px;border-radius:999px;font-weight:600}
  .overflow .slide-h2,.overflow .cover-h{outline:3px dashed #f2635f;outline-offset:6px}

  /* ---------- 模板库 ---------- */
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);padding:5px 12px;border-radius:999px;font-size:12.5px}
  .chip.on{background:#1e2a44;border-color:#2f4a7a;color:#cfe0ff}
  .tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .tpl-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .tpl-card:hover{border-color:#39445a}
  .tpl-meta{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tpl-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 方案模板编辑器 ---------- */
  .split{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  .cols3{display:grid;grid-template-columns:250px 290px minmax(0,1fr);gap:14px;align-items:start}
  .col-card{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 170px)}
  .col-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#c3cddb}
  .col-body{overflow:auto;display:flex;flex-direction:column;gap:4px;flex:1;min-height:60px}
  .col-foot{display:flex;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
  .col-foot input,.col-foot select{font-size:12px;padding:6px 8px;min-width:0}
  .col-foot .btn{flex:0 0 auto;white-space:nowrap}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-item{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .list-item:hover{background:var(--panel-2)}
  .list-item.on{background:#1e2a44;border-color:#2f4a7a}
  .seq{display:flex;flex-direction:column;gap:10px}
  .seq-row{display:grid;grid-template-columns:24px 180px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .seq-idx{width:22px;height:22px;border-radius:6px;background:var(--panel-2);display:grid;place-items:center;font-size:11px;color:var(--muted)}
  .icon-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted)}
  .icon-btn:hover{color:var(--text);border-color:#39445a}
  .empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);font-size:13px}

  /* ---------- 向导 ---------- */
  .stepper{display:flex;gap:8px;align-items:center;margin-bottom:20px}
  .step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);font-size:12px}
  .step.on{color:#cfe0ff}
  .step.on .n{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
  .step.done .n{background:#1d3a2a;border-color:#2b5540;color:#8fe0a4}
  .step-line{height:1px;width:34px;background:var(--line)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  input[type=text],textarea,select{
    width:100%;background:#12161c;border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:#3a5a92;background:#141a22}
  textarea{resize:vertical;min-height:64px;line-height:1.6}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .hint{font-size:11.5px;color:#6b7688;margin-top:5px}
  .pbar{height:6px;background:#12161c;border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .pbar > i{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#7bd88f);width:0;transition:width .35s ease}
  .log{font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:18px}

  /* ---------- 预览 ---------- */
  .preview{display:grid;grid-template-columns:180px minmax(0,1fr) 320px;gap:16px;align-items:start}
  .thumbs{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);overflow:auto;padding-right:2px}
  .thumb-btn{border:2px solid transparent;padding:0;background:none;border-radius:7px;overflow:hidden;position:relative;line-height:0}
  .thumb-btn.on{border-color:var(--accent)}
  .thumb-btn .thumb-wrap{width:152px;display:block;margin:2px}
  .thumb-btn .thumb-wrap .slide{transform:scale(.11875)}
  .thumb-btn .num{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;line-height:1.5}
  .thumb-btn .dot{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .panel h3{margin:0 0 10px;font-size:13px;letter-spacing:.3px;color:#c3cddb}
  .panel textarea{resize:none}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #212836;font-size:12.5px}
  .kv:last-child{border-bottom:0}
  .issue{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:8px;font-size:12.5px;margin-bottom:8px;background:#1a1f28;border:1px solid #232b39}
  .img-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .img-swatch{aspect-ratio:4/3;border-radius:7px;border:2px solid transparent;position:relative;overflow:hidden}

  /* ---------- 弹窗 / toast ---------- */
  .veil{position:fixed;inset:0;background:rgba(6,8,12,.66);display:grid;place-items:center;z-index:50;backdrop-filter:blur(2px)}
  .modal{width:440px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .modal h2{margin:0 0 6px;font-size:16px}
  .modal p{margin:0 0 14px;color:var(--muted);font-size:12.5px}
  .toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60}
  .toast{background:#1c2431;border:1px solid #2c3748;border-left:3px solid var(--accent-2);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .18s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .mdbox{background:#0f1319;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:11.5px;line-height:1.75;color:#a9b6c8;max-height:330px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 0}
  .mdinput{min-height:190px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7}
  .drop{border:1.5px dashed #2f3a4d;border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;display:block;transition:.15s}
  .drop:hover,.drop.over{border-color:#3a6bd0;background:#151c28;color:#c3cddb}
  .hidden{display:none !important}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#242c3a;border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">排</div>
      <div>
        <div class="brand-name">方案排版台</div>
        <div class="brand-sub">Demo · 模拟数据</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item on" data-view="home"><span class="ico">◫</span>工作台</button>
      <button class="nav-item" data-view="library"><span class="ico">▤</span>模板库</button>
      <button class="nav-item" data-view="decks"><span class="ico">≡</span>方案模板</button>
      <button class="nav-item" data-view="gallery"><span class="ico">▣</span>图库</button>
    </nav>
    <div class="side-foot">
      <div><b>MVP 演示</b>：全部为本地模拟数据</div>
      <div>不做真实解析与生成</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>

<script>
"use strict";

/* =========================================================
   模拟数据
   ========================================================= */
const DB = {
  pages: [
    { id:"p-cover-1", name:"封面 · 全幅渐变", type:"封面", layout:"cover-full", hue:[222,262], deck:"2025 徽州研学方案.pptx", page:1, uses:12 },
    { id:"p-cover-2", name:"封面 · 左图右文", type:"封面", layout:"cover-split", hue:[196,222], deck:"2025 云南研学方案.pptx", page:1, uses:7 },

    { id:"tpl-hl", name:"行程亮点模板", desc:"三个亮点卡片，一页讲透产品价值",

  gallery: [

  ],
  workDecks: [
    { id:"d1", title:"2026 春季 · 徽州研学营", meta:"6 页 · 今天 09:20", hue:[222,262], status:"已完成" },
    { id:"d2", title:"2026 暑期 · 景德镇非遗营", meta:"8 页 · 昨天", hue:[16,36], status:"已完成" },
    { id:"d3", title:"2025 秋 · 云南自然营", meta:"6 页 · 10 月 28 日", hue:[150,190], status:"待补图" }

};

const CONTENT_SAMPLE = {

const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const grad = (h1, h2, a) => "linear-gradient(135deg, hsl(" + h1 + " 62% 42%) 0%, hsl(" + h2 + " 58% 30%) 100%)";
const softGrad = (h1, h2) => "linear-gradient(135deg, hsl(" + h1 + " 70% 92%) 0%, hsl(" + h2 + " 65% 84%) 100%)";

function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast";
  if (kind === "warn") t.style.borderLeftColor = "var(--warn)";
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function pageById(id){ return DB.pages.find((p) => p.id === id); }
function deckById(id){ return DB.decks.find((d) => d.id === id); }
function galleryById(id){ return DB.gallery.find((g) => g.id === id); }
function flatPages(deck){ return deck.sections.reduce((acc, s) => acc.concat(s.pages), []); }
function sectionOf(decks, id){ return (decks || DB.decks).reduce((acc, d) => acc.concat(d.sections), []).find((s) => s.id === id); }

/* 图片槽位决策：手动 > 图库 > 待配图（key 形如 "p-hl-1:0"） */
function decisionFor(key){
  const decided = state.wizard.images[key];
  if (decided) return decided;
  const idx = Number(String(key).split(":")[1] || 0);
  return { source:"gallery", galleryId: DB.gallery[idx % DB.gallery.length].id };
}

function imageLabel(dec){
  if (!dec) return "待配图";
  if (dec.source === "manual") return "手动指定";
  if (dec.source === "gallery") return "图库命中";
  return "待配图";
}

/* 缩略图缩放：等比缩放到容器宽度 */
function fitOne(stage){
  const slide = stage.querySelector(".slide");
  if (!slide) return;
  const scale = stage.clientWidth / 1280;
  slide.style.transform = "scale(" + scale + ")";
  stage.style.height = (720 * scale) + "px";
}
function fitSlides(root){
  (root || document).querySelectorAll(".stage").forEach(fitOne);
}
window.addEventListener("resize", () => fitSlides());

/* =========================================================
   Markdown 文案模板与解析
   ========================================================= */
function buildMarkdown(deckId, c){
  const d = deckById(deckId);
  const has = (t) => d.sections.some((x) => x.type === t);
  const v = (val, ph) => (c && val != null && val !== "" ? val : ph);
  const L = [];
  L.push("# " + v(c && c.cover.title, "{{方案标题，例：2026 春季 · 徽州研学营}}"));
  L.push("");
  L.push("> " + v(c && c.cover.subtitle, "{{副标题，例：4 天 3 晚 · 初二语文与历史跨学科实践}}"));
  L.push("");
  if (has("封面")){
    L.push("标签: " + v(c && c.cover.tag, "{{主题标签，例：徽州文化 · 非遗体验}}"));
    L.push("");
  }
  if (has("亮点")){
    L.push("## 行程亮点");
    L.push("");
    for (let i = 0; i < 3; i++){
      const h = c && c.highlights[i];
      L.push("### " + v(h && h.title, "{{亮点" + (i + 1) + "标题，≤10 字}}"));
      L.push(v(h && h.text, "{{亮点" + (i + 1) + "正文，20-60 字，写清学生做什么}}"));
      L.push("");
    }
  }
  if (has("行程")){
    L.push("## 研学行程汇总");
    L.push("");
    L.push("| 日程 | 行程 | 内容 |");
    L.push("| --- | --- | --- |");
    for (let i = 0; i < 4; i++){
      const r = c && c.itinerary[i];
      L.push("| " + (r ? r.day : "D" + (i + 1)) + " | " + v(r && r.route, "{{行程}}") + " | " + v(r && r.detail, "{{内容}}") + " |");
    }
    L.push("");
  }
  if (has("汇总")){
    L.push("## 关键数据");
    L.push("");
    for (let i = 0; i < 4; i++){
      const st = c && c.summary[i];
      const val = st ? st.value + (st.unit ? " " + st.unit : "") : "{{数值 单位}}";
      L.push("- " + val + " | " + (st ? st.label : "{{指标名}}"));
    }
    L.push("");
  }
  if (has("须知")){
    L.push("## 报名须知");
    L.push("");
    if (c && c.note.length){
      c.note.forEach((x) => L.push("- " + x));
    } else {
      L.push("- {{须知 1，例：费用含交通、住宿、课程物料与保险}}");
      L.push("- {{须知 2}}");
    }
    L.push("");
  }
  return L.join("\n");
}

function deckMarkdownTemplate(deckId){ return buildMarkdown(deckId, null); }
function contentToMarkdown(deckId, c){ return buildMarkdown(deckId, c); }

function parseMarkdownContent(md){
  const c = { cover:{ title:"", subtitle:"", tag:"" }, highlights:[], itinerary:[], summary:[], note:[] };
  const warn = [];
  const lines = String(md || "").split(/\r?\n/);
  let sec = "";
  let item = null;
  let headerSeen = false;

  lines.forEach((raw) => {
    const line = raw.trim();
    if (!line){ item = null; return; }

    if (line.indexOf("## ") === 0){ sec = line.slice(3).trim(); item = null; headerSeen = false; return; }
    if (line.indexOf("# ") === 0){ c.cover.title = line.slice(2).trim(); return; }
    if (line.indexOf("### ") === 0){
      item = { title: line.slice(4).trim(), text:"" };
      if (sec.indexOf("亮点") >= 0) c.highlights.push(item);
      return;
    }
    if (line.indexOf("> ") === 0){ c.cover.subtitle = line.slice(2).trim(); return; }

    const mt = line.match(/^标签[:：]\s*(.+)$/);
    if (mt){ c.cover.tag = mt[1].trim(); return; }

    if (line.charAt(0) === "|"){
      const cells = line.replace(/^\|/, "").replace(/\|$/, "").split("|").map((x) => x.trim());
      const isSep = cells.every((x) => x === "" || /^:?-{2,}:?$/.test(x));
      if (isSep) return;
      if (!headerSeen){ headerSeen = true; return; }
      if (sec.indexOf("行程") >= 0 && cells.length >= 3){
        c.itinerary.push({ day:cells[0], route:cells[1], detail:cells[2] });
      }
      return;
    }

    if (line.indexOf("- ") === 0){
      const body = line.slice(2).trim();
      if (sec.indexOf("数据") >= 0 || sec.indexOf("汇总") >= 0){
        const parts = body.split("|");
        if (parts.length >= 2){
          const head = parts[0].trim().split(/\s+/);
          c.summary.push({ value:head[0] || "", unit:head.slice(1).join(" "), label:parts[1].trim() });
        }
      } else {
        c.note.push(body);
      }
      return;
    }

    if (item) item.text = (item.text ? item.text + " " : "") + line;
  });

  if (!c.cover.title) warn.push("缺少一级标题：# 方案标题");
  if (!c.cover.subtitle) warn.push("缺少副标题：> 副标题");
  if (!c.cover.tag) warn.push("缺少主题标签：标签: xxx");
  if (!c.highlights.length) warn.push("未解析到亮点：需要 ## 行程亮点 与其下的 ### 小节");
  c.highlights.forEach((h, i) => { if (!h.text) warn.push("亮点 " + (i + 1) + " 只有标题、缺正文"); });
  if (!c.itinerary.length) warn.push("未解析到行程：需要 ## 研学行程汇总 下的表格");
  if (!c.summary.length) warn.push("未解析到关键数据：## 关键数据 下的 - 值 单位 | 指标名");
  if (!c.note.length) warn.push("未解析到须知：## 报名须知 下的 - 列表");

  return { content:c, warnings:warn };
}

function parseResultHTML(parsed){
  const c = parsed.content;
  const rows = [
    ["方案标题", c.cover.title, !!c.cover.title],
    ["副标题", c.cover.subtitle, !!c.cover.subtitle],
    ["主题标签", c.cover.tag, !!c.cover.tag],
    ["行程亮点", c.highlights.length + " 条", c.highlights.length > 0],
    ["行程安排", c.itinerary.length + " 行", c.itinerary.length > 0],
    ["关键数据", c.summary.length + " 项", c.summary.length > 0],
    ["报名须知", c.note.length + " 条", c.note.length > 0]
  ];
  return '<div class="panel" style="padding:10px 12px;background:#12161c">'
    + rows.map((r) => '<div class="kv"><span>' + esc(r[0]) + "</span>"
      + '<span class="row"><span class="tag ' + (r[2] ? "ok" : "warn") + '">' + (r[2] ? "已解析" : "缺失") + "</span>"
      + '<span class="sub" style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(r[1]) + "</span></span></div>").join("")
    + "</div>"
    + (parsed.warnings.length
      ? '<div style="margin-top:10px">' + parsed.warnings.map((w) => '<div class="issue"><span class="tag warn">提醒</span><span>' + esc(w) + "</span></div>").join("") + "</div>"
      : '<div class="issue" style="margin-top:10px"><span class="tag ok">通过</span><span>字段齐全，可以生成</span></div>');
}

function viewWizard(){

    const n = i + 1;
    const cls = w.step === n ? "on" : w.step > n ? "done" : "";
    return '<div class="step ' + cls + '"><span class="n">' + (w.step > n ? "✓" : n) + "</span>" + s + "</div>"
      + (i < steps.length - 1 ? '<div class="step-line"></div>' : "");
  }).join("");

  let body = "";
  if (w.step === 1){
    const cards = DB.decks.map((d) => '<div class="tpl-card" data-pick="' + d.id + '" style="cursor:pointer;border-color:' + (w.deckId === d.id ? "#3a6bd0" : "var(--line)") + '">'
      + '<div class="stage" data-stage>' + slideHTML(pageById(flatPages(d)[0]), CONTENT_SAMPLE, { index:0 }) + "</div>"

  }

  if (w.step === 2){
    const d = deckById(w.deckId);
    const tpl = deckMarkdownTemplate(w.deckId);
    const parsed = w.parsed;
    const mdText = w.mdText || "";
    body = '<div class="two">'
      + '<div class="card"><h3 style="margin:0 0 8px;font-size:13px">标准文案模板 · 来自「' + esc(d.name) + '」</h3>'
      + '<div class="hint">按板块生成骨架，只填花括号内容，不要改动 <code>#</code> / <code>##</code> 标题行</div>'
      + '<pre class="mdbox">' + esc(tpl) + "</pre>"

      + '<button class="btn sm" data-act="fill-sample">填入示例文案</button></div></div>'
      + '<div class="card"><h3 style="margin:0 0 8px;font-size:13px">上传 Markdown 文案</h3>'
      + '<label class="drop" id="drop"><input type="file" id="md-file" accept=".md,.markdown,text/markdown" style="display:none">'
      + '<div>点击选择 <b>.md</b> 文件，或把文件拖到这里</div></label>'
      + '<div class="field" style="margin-top:12px"><label>或直接粘贴 / 编辑</label>'
      + '<textarea id="md-text" class="mdinput" placeholder="# 方案标题&#10;> 副标题">' + esc(mdText) + "</textarea></div>"
      + '<div class="row"><button class="btn primary sm" data-act="parse-md">解析文案</button>'
      + (parsed ? '<span class="tag ok">已解析</span>' : '<span class="tag">待解析</span>')
      + '<span class="hint" style="margin-left:auto">解析在本地完成，不上传文件</span></div></div></div>'
      + '<div class="card" style="margin-top:12px"><h3 style="margin:0 0 10px;font-size:13px">字段映射结果</h3>'
      + (parsed ? parseResultHTML(parsed)
                : '<div class="empty">上传或粘贴 Markdown 后点「解析文案」，这里会显示每个板块的解析情况与缺失字段</div>')
      + "</div>";
  }

  if (w.step === 3){
    const d = deckById(w.deckId);
    const slots = [];
    flatPages(d).forEach((pid) => {
      const p = pageById(pid);
      if (p.layout === "cover-full" || p.layout === "cover-split") slots.push({ page:p, n:1 });
      if (p.layout === "hl-3col") slots.push({ page:p, n:3 });
    });
    const rows = slots.map((s) => {
      const cells = [];
      for (let i = 0; i < s.n; i++){

        const g = dec && dec.galleryId ? galleryById(dec.galleryId) : null;
        cells.push('<div class="img-swatch" style="background:' + (g ? grad(g.hue[0], g.hue[1]) : "repeating-linear-gradient(45deg,#e8ebf1,#e8ebf1 10px,#f2f4f8 10px,#f2f4f8 20px)") + '"></div>');
      }
      return '<div class="kv"><span>' + esc(s.page.name) + " · " + s.n + " 图</span>"
        + '<span class="row">' + cells.join("") + '<span class="tag ok">图库命中</span></span></div>';
    }).join("");

    body = '<div class="two"><div class="card"><h3 style="margin:0 0 10px;font-size:13px">配图策略</h3>'

  return '<div class="top"><div><h1>新建方案</h1><div class="sub">选择模板 → 填写文案 → 配图生成</div></div>'
    + '<div class="row"><button class="btn ghost" data-act="back">返回</button></div></div>'
    + '<div class="stepper">' + stepper + "</div>" + body

    + (w.step > 1 ? '<button class="btn" data-act="prev">上一步</button>' : "")

    + "</div>";
}

function issuesHTML(cur){
  return cur.issues.length
    ? cur.issues.map((x) => '<div class="issue"><span class="tag ' + (x.level === "warn" ? "warn" : "bad") + '">' + (x.level === "warn" ? "提示" : "阻塞") + "</span><span>" + esc(x.text) + "</span></div>").join("")
    : '<div class="issue"><span class="tag ok">通过</span><span>该页无问题</span></div>';
}

function viewPreview(){
  const deck = state.deck;
  if (!deck) return '<div class="empty">还没有生成的方案</div>';
  const items = deck.pages.map((it, i) => {
    const cls = i === state.selected ? "on" : "";
    const warn = it.hasIssue ? '<span class="dot"></span>' : "";
    return '<button class="thumb-btn ' + cls + '" data-page="' + i + '"><span class="num">' + (i + 1) + "</span>" + warn + '<span class="thumb-wrap">' + it.html + "</span></button>";
  }).join("");

  const cur = deck.pages[state.selected];

  const fields = cur.fields.map((f) => {

      + ' <span class="cnt" data-cnt="' + esc(f.key) + '" style="float:right;color:' + (over ? "var(--danger)" : "var(--muted)") + '">' + f.len + "/" + f.budget + "</span></label>"
      + '<textarea data-field="' + esc(f.key) + '" style="min-height:' + (f.multiline ? 60 : 0) + "px;height:" + (f.multiline ? 60 : 36) + "px;overflow:" + (f.multiline ? "auto" : "hidden") + '">' + esc(f.value) + "</textarea></div>";

  const picks = cur.slots.map((s) => {

    return '<div style="margin-bottom:10px"><div class="sub" style="margin-bottom:6px">' + esc(s.label) + ' <span class="tag ' + (s.source === "todo" ? "warn" : "ok") + '">' + esc(imageLabel(s)) + "</span></div>"
      + '<div class="img-pick">' + opts + '<button class="img-swatch" data-slot="' + esc(s.key) + '" data-gid="" style="background:#1a1f28;border:1px dashed #39445a;color:var(--muted);font-size:11px">手动</button></div></div>';
  }).join("");

  return '<div class="top"><div><h1>方案预览</h1><div class="sub">' + esc(deck.title) + " · " + deck.pages.length + ' 页 · 自动排版结果</div></div>'
    + '<div class="row"><button class="btn ghost" data-act="home">返回工作台</button><button class="btn primary" data-act="export">导出 pptx</button></div></div>'
    + '<div class="preview"><div class="thumbs">' + items + "</div>"
    + '<div><div class="panel" style="padding:10px"><div class="stage" id="stage-main">' + cur.html + "</div></div>"
    + '<div class="row" style="margin-top:10px;justify-content:space-between"><div class="sub">第 ' + (state.selected + 1) + " / " + deck.pages.length + ' 页 · ' + esc(cur.page.name) + '</div>'
    + '<div class="row"><button class="btn sm" data-nav="prev">上一页</button><button class="btn sm" data-nav="next">下一页</button></div></div></div>'
    + '<div><div class="panel" id="issues-panel" style="margin-bottom:12px"><h3>问题检查</h3>' + issues + "</div>"
    + '<div class="panel" style="margin-bottom:12px"><h3>文案字段（可编辑）</h3>' + fields + "</div>"
    + '<div class="panel"><h3>图片槽位</h3>' + (picks || '<div class="sub">该页无图片槽位</div>') + "</div></div></div>";
}

function render(){
  const views = { home:viewHome, library:viewLibrary, decks:viewDecks, gallery:viewGallery, wizard:viewWizard, preview:viewPreview };
  $("#main").innerHTML = (views[state.view] || viewHome)();
  document.querySelectorAll(".nav-item").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  fitSlides(document);
}

function go(view){
  state.view = view;
  render();
  window.scrollTo(0, 0);
  if (history.replaceState) history.replaceState(null, "", "#" + view);
}

/* 支持 #library / #preview 等深链，便于演示直接跳到某个界面 */
function bootFromHash(){
  const raw = (location.hash || "").replace("#", "");
  if (!raw) return false;
  const pm = raw.match(/^preview(?:-(\d+))?$/);
  const h = pm ? "preview" : (raw === "wizard-md" ? "wizard" : raw);
  if (h === "preview" && !state.deck){
    state.deck = buildDeck("tpl-full", JSON.parse(JSON.stringify(CONTENT_SAMPLE)));
    state.selected = 0;
  }
  if (pm && pm[1]) state.selected = Number(pm[1]);
  if (h === "wizard"){
    state.wizard = { step:2, deckId:"tpl-full", content:null, images:{}, mdText:"", parsed:null };
    if (raw === "wizard-md"){
      state.wizard.mdText = contentToMarkdown("tpl-full", JSON.parse(JSON.stringify(CONTENT_SAMPLE)));
      state.wizard.parsed = parseMarkdownContent(state.wizard.mdText);
      state.wizard.content = state.wizard.parsed.content;
    }
  }
  if (["home","library","decks","gallery","wizard","preview"].indexOf(h) >= 0){ go(h); return true; }
  return false;
}

/* =========================================================
   生成逻辑（模拟）
   ========================================================= */
function buildDeck(deckId, content){
  const d = deckById(deckId);
  const items = [];
  d.sections.forEach((sec) => sec.pages.forEach((pid) => items.push({ pid:pid, section:sec })));
  const pages = items.map((item, i) => {
    const pid = item.pid;
    const page = pageById(pid);
    const fields = [];
    const issues = [];
    const slots = [];

    if (page.layout.indexOf("cover") === 0){
      fields.push({ key:"title", label:"封面标题", value:content.cover.title, len:content.cover.title.length, budget:CHECK_BUDGET["cover.title"], multiline:false });
      fields.push({ key:"subtitle", label:"副标题", value:content.cover.subtitle, len:content.cover.subtitle.length, budget:CHECK_BUDGET["cover.subtitle"], multiline:false });
      const dc0 = decisionFor(page.id + ":0");
      slots.push({ key:page.id + ":0", label:"封面主图", source:dc0.source, galleryId:dc0.galleryId || null });
    }
    if (page.layout === "hl-3col"){
      content.highlights.forEach((h, hi) => {
        fields.push({ key:"hl" + hi + ".title", label:"亮点 " + (hi + 1) + " 标题", value:h.title, len:h.title.length, budget:CHECK_BUDGET["hl.title"], multiline:false });
        fields.push({ key:"hl" + hi + ".text", label:"亮点 " + (hi + 1) + " 正文", value:h.text, len:h.text.length, budget:CHECK_BUDGET["hl.text"], multiline:true });
        const dch = decisionFor(page.id + ":" + hi);
        slots.push({ key:page.id + ":" + hi, label:"亮点 " + (hi + 1) + " 配图", source:dch.source, galleryId:dch.galleryId || null });
      });
    }
    if (page.layout === "it-table"){
      content.itinerary.forEach((r, ri) => {
        fields.push({ key:"it" + ri + ".route", label:"D" + (ri + 1) + " 行程", value:r.route, len:r.route.length, budget:CHECK_BUDGET["it.route"], multiline:false });
      });
    }
    if (page.layout === "sum-stats"){
      content.summary.forEach((s, si) => {
        fields.push({ key:"sum" + si + ".label", label:"指标 " + (si + 1), value:s.label, len:s.label.length, budget:CHECK_BUDGET["sum.label"], multiline:false });
      });
    }
    if (page.layout === "note-2col"){
      content.note.forEach((n, ni) => {
        fields.push({ key:"note" + ni, label:"须知 " + (ni + 1), value:n, len:n.length, budget:CHECK_BUDGET["note.item"], multiline:false });
      });
    }

    fields.forEach((f) => {
      if (f.len > f.budget) issues.push({ level:"warn", text:"「" + f.label + "」超出字数预算 " + f.len + "/" + f.budget + "，将触发字号阶梯缩小" });
    });
    if (slots.some((s) => s.source === "todo")) issues.push({ level:"warn", text:"存在待配图槽位，已用占位色块替代" });

    return {
      page:page, section:item.section, index:i, fields:fields, issues:issues, slots:slots,
      hasIssue:issues.length > 0,
      html:slideHTML(page, content, { index:i }),
      content:content
    };
  });
  return { title:content.cover.title, pages:pages };
}

function generate(){
  const w = state.wizard;
  const steps = ["载入方案模板", "绑定文案字段", "检索图库图片", "处理文本溢出", "渲染预览"];
  const bar = $("#gen-bar");
  const log = $("#gen-log");
  if (!bar) return;
  let i = 0;
  const tick = () => {
    if (i < steps.length){
      log.textContent = "▸ " + steps[i];
      bar.style.width = Math.round(((i + 1) / steps.length) * 100) + "%";
      i++;
      setTimeout(tick, 420);
    } else {
      log.textContent = "✔ 生成完成";
      state.deck = buildDeck(w.deckId, w.content || CONTENT_SAMPLE);
      state.selected = 0;
      toast("方案生成完成，共 " + state.deck.pages.length + " 页");
      setTimeout(() => go("preview"), 320);
    }
  };
  tick();
}

/* =========================================================
   事件
   ========================================================= */
document.addEventListener("click", (e) => {
  const nav = e.target.closest(".nav-item");
  if (nav){ go(nav.dataset.view); return; }

  const chip = e.target.closest("[data-filter]");
  if (chip){ state.filter = chip.dataset.filter; render(); return; }

  const deckItem = e.target.closest("[data-deck]");
  if (deckItem){ state.activeDeck = deckItem.dataset.deck; render(); return; }

  const pick = e.target.closest("[data-pick]");
  if (pick){ state.wizard.deckId = pick.dataset.pick; render(); return; }

  const moveSec = e.target.closest("[data-move-sec]");
  if (moveSec){
    const d = deckById(state.activeDeck);
    const sid = moveSec.dataset.sid;
    const i = d.sections.findIndex((x) => x.id === sid);
    const op = moveSec.dataset.moveSec;
    if (op === "up" && i > 0){ const t = d.sections[i - 1]; d.sections[i - 1] = d.sections[i]; d.sections[i] = t; }
    if (op === "down" && i < d.sections.length - 1){ const t = d.sections[i + 1]; d.sections[i + 1] = d.sections[i]; d.sections[i] = t; }
    render(); toast("已调整板块顺序");
    return;
  }

  const delSec = e.target.closest("[data-del-sec]");
  if (delSec){
    const d = deckById(state.activeDeck);
    const sid = delSec.dataset.delSec;
    d.sections = d.sections.filter((x) => x.id !== sid);
    state.activeSection = d.sections[0] ? d.sections[0].id : null;
    render(); toast("已删除板块");
    return;
  }

  const delDeck = e.target.closest("[data-del-deck]");
  if (delDeck){
    const id = delDeck.dataset.delDeck;
    if (DB.decks.length <= 1){ toast("至少保留一个方案模板", "warn"); return; }
    DB.decks = DB.decks.filter((x) => x.id !== id);
    if (state.activeDeck === id) state.activeDeck = DB.decks[0].id;
    state.activeSection = deckById(state.activeDeck).sections[0] ? deckById(state.activeDeck).sections[0].id : null;
    render(); toast("已删除方案模板");
    return;
  }

  const secItem = e.target.closest("[data-section]");
  if (secItem){ state.activeSection = secItem.dataset.section; render(); return; }

  const moveBtn = e.target.closest("[data-move]");
  if (moveBtn){
    const d = deckById(state.activeDeck);
    const sec = d.sections.find((x) => x.id === state.activeSection) || d.sections[0];
    if (!sec) return;
    const idx = Number(moveBtn.dataset.idx);
    const op = moveBtn.dataset.move;
    if (op === "del") sec.pages.splice(idx, 1);
    if (op === "up" && idx > 0){ const t = sec.pages[idx - 1]; sec.pages[idx - 1] = sec.pages[idx]; sec.pages[idx] = t; }
    if (op === "down" && idx < sec.pages.length - 1){ const t = sec.pages[idx + 1]; sec.pages[idx + 1] = sec.pages[idx]; sec.pages[idx] = t; }
    render(); toast("已更新页序");
    return;
  }

  const openCard = e.target.closest("[data-open]");
  if (openCard){
    state.deck = buildDeck("tpl-full", CONTENT_SAMPLE);
    state.selected = 0;
    go("preview");
    return;
  }

  const pageBtn = e.target.closest("[data-page]");
  if (pageBtn){ state.selected = Number(pageBtn.dataset.page); render(); return; }

  const navBtn = e.target.closest("[data-nav]");
  if (navBtn && state.deck){
    const n = state.deck.pages.length;
    state.selected = navBtn.dataset.nav === "next" ? Math.min(n - 1, state.selected + 1) : Math.max(0, state.selected - 1);
    render(); return;
  }

  const slotBtn = e.target.closest("[data-slot]");
  if (slotBtn && state.deck){
    const slot = slotBtn.dataset.slot;
    const gid = slotBtn.dataset.gid;
    state.wizard.images[slot] = gid ? { source:"manual", galleryId:gid } : { source:"todo" };
    const cur = state.deck.pages[state.selected];
    const target = cur.slots.find((s) => s.key === slot);
    if (target){
      target.source = gid ? "manual" : "todo";
      target.galleryId = gid || null;
    }
    state.deck = buildDeck(state.wizard.deckId, state.wizard.content || CONTENT_SAMPLE);
    render();
    toast(gid ? "已指定图片" : "已标记为待配图");
    return;
  }

  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;

  if (a === "new"){
    state.wizard = { step:1, deckId: state.view === "decks" ? state.activeDeck : "tpl-full", content:null, images:{}, mdText:"", parsed:null };
    go("wizard"); return;
  }
  if (a === "back" || a === "home"){ go(state.view === "wizard" ? "home" : "home"); return; }
  if (a === "next"){
    if (state.wizard.step < 3){ state.wizard.step++; render(); }
    return;
  }
  if (a === "prev"){ state.wizard.step = Math.max(1, state.wizard.step - 1); render(); return; }
  if (a === "generate"){ generate(); return; }

  if (a === "new-deck"){
    const input = document.getElementById("new-deck-name");
    const name = input && input.value.trim();
    if (!name){ toast("请先填写模板名称", "warn"); return; }
    const id = "tpl-" + Date.now();
    DB.decks.push({ id:id, name:name, desc:"新建模板", sections:[] });
    state.activeDeck = id;
    state.activeSection = null;
    render(); toast("已新建方案模板：" + name);
    return;
  }
  if (a === "new-section"){
    const sel = document.getElementById("new-section-type");
    const d = deckById(state.activeDeck);
    const preset = SECTION_TYPES.find((x) => x.type === (sel ? sel.value : "封面")) || SECTION_TYPES[0];
    const sid = "sec-" + Date.now();
    d.sections.push({ id:sid, name:preset.name, type:preset.type, pages:[preset.page] });
    state.activeSection = sid;
    render(); toast("已添加板块：" + preset.name);
    return;
  }

  if (a === "fill-sample"){
    state.wizard.mdText = contentToMarkdown(state.wizard.deckId, CONTENT_SAMPLE);
    state.wizard.parsed = parseMarkdownContent(state.wizard.mdText);
    state.wizard.content = state.wizard.parsed.content;
    render(); toast("已填入示例文案");
    return;
  }
  if (a === "parse-md"){
    const box = document.getElementById("md-text");
    const text = box ? box.value : (state.wizard.mdText || "");
    state.wizard.mdText = text;
    state.wizard.parsed = parseMarkdownContent(text);
    state.wizard.content = state.wizard.parsed.content;
    render();
    toast(state.wizard.parsed.warnings.length ? "解析完成，有 " + state.wizard.parsed.warnings.length + " 项提醒" : "解析完成，字段齐全", state.wizard.parsed.warnings.length ? "warn" : "ok");
    return;
  }
  if (a === "download-md"){
    const md = deckMarkdownTemplate(state.wizard.deckId);
    const blob = new Blob([md], { type:"text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = (deckById(state.wizard.deckId) || {}).name + "-文案模板.md";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("已下载文案模板");
    return;
  }

  if (a === "add-page"){
    const sel = document.getElementById("add-page");
    const d = deckById(state.activeDeck);
    const sec = d.sections.find((x) => x.id === state.activeSection) || d.sections[0];
    if (sel && sel.value && sec){ sec.pages.push(sel.value); render(); toast("已添加页面到「" + sec.name + "」"); }
    return;
  }
  if (a === "save-deck"){ toast("方案模板已保存（模拟，仅存于内存）"); return; }
  if (a === "export"){ toast("已导出 pptx（模拟，未生成真实文件）", "warn"); return; }
  if (a === "parse"){ parseModal(); return; }
});

document.addEventListener("input", (e) => {
  const bind = e.target.closest("[data-bind]");
  if (bind){
    if (!state.wizard.content) state.wizard.content = JSON.parse(JSON.stringify(CONTENT_SAMPLE));
    const c = state.wizard.content;
    const key = bind.dataset.bind;
    const val = bind.value;
    const m = key.match(/^(hl|it)-(.+)-(\d+)$/);
    if (key === "cover-title") c.cover.title = val;
    else if (key === "cover-subtitle") c.cover.subtitle = val;
    else if (key === "cover-tag") c.cover.tag = val;
    else if (m){
      const idx = Number(m[3]);
      if (m[1] === "hl"){ if (m[2] === "title") c.highlights[idx].title = val; else c.highlights[idx].text = val; }
      if (m[1] === "it"){
        if (m[2] === "day") c.itinerary[idx].day = val;
        if (m[2] === "route") c.itinerary[idx].route = val;
        if (m[2] === "detail") c.itinerary[idx].detail = val;
      }
    }
    return;
  }

  const field = e.target.closest("[data-field]");
  if (field && state.deck){
    const cur = state.deck.pages[state.selected];
    const key = field.dataset.field;
    const val = field.value;
    const f = cur.fields.find((x) => x.key === key);
    if (f){ f.value = val; f.len = val.length; }
    const c = cur.content;
    if (key === "title") c.cover.title = val;
    if (key === "subtitle") c.cover.subtitle = val;
    const m = key.match(/^hl(\d+)\.(title|text)$/);
    if (m){ const i = Number(m[1]); c.highlights[i][m[2]] = val; }
    const n = key.match(/^note(\d+)$/);
    if (n){ c.note[Number(n[1])] = val; }
    const s = key.match(/^sum(\d+)\.label$/);
    if (s){ c.summary[Number(s[1])].label = val; }
    const it = key.match(/^it(\d+)\.route$/);
    if (it){ c.itinerary[Number(it[1])].route = val; }

    cur.html = slideHTML(cur.page, c, { index:cur.index });
    const stage = document.getElementById("stage-main");
    if (stage){ stage.innerHTML = cur.html; fitOne(stage); }
    const thumb = document.querySelector('.thumb-btn[data-page="' + cur.index + '"] .thumb-wrap');
    if (thumb) thumb.innerHTML = cur.html;
    const cnt = document.querySelector('[data-cnt="' + key + '"]');
    if (cnt && f){
      const over = f.len > f.budget;
      cnt.textContent = f.len + "/" + f.budget;
      cnt.style.color = over ? "var(--danger)" : "var(--muted)";
    }
    cur.issues = [];
    cur.fields.forEach((x) => {
      if (x.len > x.budget) cur.issues.push({ level:"warn", text:"「" + x.label + "」超出字数预算 " + x.len + "/" + x.budget + "，将触发字号阶梯缩小" });
    });
    if (cur.slots.some((sl) => sl.source === "todo")) cur.issues.push({ level:"warn", text:"存在待配图槽位，已用占位色块替代" });
    cur.hasIssue = cur.issues.length > 0;
    const ip = document.getElementById("issues-panel");
    if (ip) ip.innerHTML = "<h3>问题检查</h3>" + issuesHTML(cur);
  }
});

/* Markdown 文件读取 */
function readMdFile(file){
  if (!file) return;
  if (!/\.(md|markdown|txt)$/i.test(file.name)){ toast("请选择 .md 文件", "warn"); return; }
  const reader = new FileReader();
  reader.onload = function(){
    state.wizard.mdText = String(reader.result || "");
    state.wizard.parsed = parseMarkdownContent(state.wizard.mdText);
    state.wizard.content = state.wizard.parsed.content;
    render();
    toast("已解析 " + file.name + "，字段 " + (state.wizard.parsed.warnings.length ? "有 " + state.wizard.parsed.warnings.length + " 项提醒" : "齐全"));
  };
  reader.onerror = function(){ toast("文件读取失败", "warn"); };
  reader.readAsText(file, "utf-8");
}

document.addEventListener("change", function(e){
  if (e.target && e.target.id === "md-file") readMdFile(e.target.files && e.target.files[0]);
});

document.addEventListener("dragover", function(e){
  const z = e.target && e.target.closest ? e.target.closest("#drop") : null;
  if (z){ e.preventDefault(); z.classList.add("over"); }
});
document.addEventListener("dragleave", function(e){
  const z = e.target && e.target.closest ? e.target.closest("#drop") : null;
  if (z) z.classList.remove("over");
});
document.addEventListener("drop", function(e){
  const z = e.target && e.target.closest ? e.target.closest("#drop") : null;
  if (!z) return;
  e.preventDefault();
  z.classList.remove("over");
  readMdFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
});

/* 解析历史方案：模拟进度 */
function parseModal(){
  const veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML = '<div class="modal"><h2>解析历史方案</h2>'
    + '<p>选择一份 .pptx，自动抽取模板页与图片素材（Demo 为模拟过程）</p>'
    + '<div class="log" id="parse-log">准备中…</div><div class="pbar"><i id="parse-bar"></i></div>'
    + '<div class="row" style="margin-top:16px;justify-content:flex-end">'
    + '<button class="btn ghost" data-close>取消</button><button class="btn primary" data-start>开始解析</button></div></div>';
  document.body.appendChild(veil);

  veil.addEventListener("click", (e) => {
    if (e.target === veil || e.target.closest("[data-close]")) veil.remove();
    if (e.target.closest("[data-start]")){
      const steps = ["读取 pptx 结构", "识别页型（封面/亮点/行程/汇总）", "清空文本，保留形状与配色", "抽取图片并打标签", "写入模板库"];
      let i = 0;
      const bar = $("#parse-bar", veil);
      const log = $("#parse-log", veil);
      const btn = veil.querySelector("[data-start]");
      btn.disabled = true;
      const tick = () => {
        if (i < steps.length){
          log.textContent = "▸ " + steps[i];
          bar.style.width = Math.round(((i + 1) / steps.length) * 100) + "%";
          i++;
          setTimeout(tick, 400);
        } else {
          log.textContent = "✔ 完成，新增 2 个模板页、6 张图片";
          DB.pages.push({
            id:"p-new-" + Date.now(), name:"亮点 · 四栏序号", type:"亮点", layout:"hl-3col",
            hue:[248,284], deck:"2026 新解析方案.pptx", page:5, uses:0
          });
          setTimeout(() => { veil.remove(); render(); toast("已新增 2 个模板页、6 张图片（模拟）"); }, 500);
        }
      };
      tick();
    }
  });
}

/* 首屏 */
render();
bootFromHash();
window.addEventListener("hashchange", () => { bootFromHash(); });
setTimeout(() => fitSlides(document), 30);
</script>
